
<section class="section" id="calendario" aria-labelledby="calendar-title">
  <div class="section-head"><div>
    <span class="eyebrow">AGENDA DE PAOLA</span>
    <h1 id="calendar-title">Calendario de Paola</h1>
  </div></div>
  <div class="calendar-box">
    <div class="calendar-controls">
      <button type="button" class="outline" id="calendar-prev" aria-label="Mes anterior">←</button>
      <h3 id="calendar-month" aria-live="polite"></h3>
      <button type="button" class="outline" id="calendar-next" aria-label="Mes siguiente">→</button>
      <button type="button" class="outline" id="calendar-today">Hoy</button>
    </div>
    <div class="calendar-grid" id="calendar-grid" aria-label="Días del mes"></div>
    <div class="calendar-controls">
      <h4 id="calendar-selection">Eventos del mes</h4>
      <button type="button" class="outline" id="calendar-clear" hidden>Ver todo el mes</button>
    </div>
    <p id="calendar-status" role="status"></p>
    <ul class="calendar-events" id="calendar-events"></ul>
  </div>
</section>
