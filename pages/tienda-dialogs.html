<dialog id="market-dialog" aria-labelledby="market-dialog-title"><form id="market-form" class="ride-form">
<button type="button" class="close" data-close aria-label="Cerrar">×</button>
<h2 id="market-dialog-title">Publicar un producto</h2>
<label>Producto <input name="title" required maxlength="120" autocomplete="off"></label>
<label>Precio en euros <input name="price" required maxlength="100" type="number" min="0" max="1000000" step="0.01"></label>
<label>Localidad <input name="location" required maxlength="100" placeholder="Paola"></label>
<label>Descripción y condiciones <textarea name="description" required maxlength="3000" rows="5"></textarea></label>
<label>WhatsApp con prefijo internacional <input name="phone" type="tel" required maxlength="25" autocomplete="tel" placeholder="+39 …"></label>
<label class="ride-consent"><input name="consent" type="checkbox" required> Acepto compartir este WhatsApp con usuarios con sesión para que me contacten sobre esta publicación.</label>
<p>Las publicacións permanecen visibles durante 30 días. Podés editarlas o eliminarlas antes.</p>
<p class="form-status" role="status"></p><button type="submit" class="primary">Guardar publicación</button>
</form></dialog>
